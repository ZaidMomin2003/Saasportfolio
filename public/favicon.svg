<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#990020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#050505"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#ff0033" stroke-width="1" opacity="0.15"/>
  <text x="32" y="48" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-weight="900" font-size="44" fill="url(#g)" filter="url(#glow)" letter-spacing="-2">Z</text>
  <circle cx="50" cy="14" r="4" fill="#ff0033" opacity="0.8"/>
</svg>
